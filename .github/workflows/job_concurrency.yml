name: my first workflow | shell script

on:
   workflow_dispatch:
   push:
    branches: 
     - main
     
jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repo
              uses: actions/checkout@v4

            - name: list files
              run:  ls -ltra

            - name: run shell script
              run:
                |
                chmod +x script.sh
                ./script.sh

    sec_job:
        runs-on: ubuntu-latest
        needs: first_job
        concurrency:
          group: prod-deploy
          cancel-in-progress: true
        steps:
            - name: checkout repo
              uses: actions/checkout@v4

            - name: list files
              run:  ls -ltra

            - name: run shell script
              run:
                |
                chmod +x script.sh
                ./script.sh
                sleep 600



       

